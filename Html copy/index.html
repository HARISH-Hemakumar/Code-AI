<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #5b6475;
      --paper: #fffaf0;
      --coral: #ff6b6b;
      --gold: #ffd166;
      --teal: #2ec4b6;
      --blue: #3a86ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(115deg, rgba(255, 209, 102, 0.45), transparent 34%),
        linear-gradient(245deg, rgba(46, 196, 182, 0.32), transparent 40%),
        radial-gradient(circle at 80% 12%, rgba(58, 134, 255, 0.28), transparent 28%),
        var(--paper);
    }

    main {
      width: min(92vw, 820px);
      padding: clamp(32px, 8vw, 82px);
      position: relative;
      text-align: center;
      isolation: isolate;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 28px 80px rgba(17, 24, 39, 0.14);
      backdrop-filter: blur(18px);
    }

    .sparkline {
      width: 180px;
      height: 6px;
      margin: 0 auto 30px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--coral), var(--gold), var(--teal), var(--blue));
      box-shadow: 0 10px 34px rgba(58, 134, 255, 0.28);
    }

    h1 {
      margin: 0;
      font-size: clamp(52px, 11vw, 128px);
      line-height: 0.88;
      letter-spacing: 0;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      background: linear-gradient(90deg, #111827 4%, #ff6b6b 36%, #2ec4b6 70%, #3a86ff 96%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    p {
      max-width: 520px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.65;
    }

    .signature {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 34px;
      padding: 12px 18px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #2f3747;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 8px rgba(46, 196, 182, 0.16);
    }

    @media (max-width: 560px) {
      main {
        padding: 34px 22px;
      }

      .signature {
        width: 100%;
        justify-content: center;
        letter-spacing: 0.08em;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="sparkline" aria-hidden="true"></div>
    <h1>Hello <span>World</span></h1>
    <p>A tiny first page with a little polish: bright color, soft glass, and a cheerful entrance into the browser.</p>
    <div class="signature">
      <span class="dot" aria-hidden="true"></span>
      Ready to shine
    </div>
  </main>
</body>
</html>
